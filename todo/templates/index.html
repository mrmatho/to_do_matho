<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Matho's ToDo Home</title>

    <link href="{{ url_for('static', filename='main.css') }}" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/htmx.org@4.0.0/dist/htmx.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
    <header>
    <h1> Matho's To-Do list</h1>
    <sub>Complete with categories, tags and contexts</sub>

    </header>
    <aside>
        {{ message }}
    </aside>
    <section class="board" id="board">
        {% for category, tasks in board %}
            {% include '_category_column.html' %}
        {% endfor %}
    </section>
    <form class="add-category"
          hx-post="{{ url_for('categories.create') }}"
          hx-target="#board"
          hx-swap="beforeend"
          hx-status:4xx="target:#add-category-error swap:innerHTML"
          hx-status:5xx="swap:none">
        <input type="text" name="name" placeholder="New category" aria-label="New category name" required>
        <input type="color" name="color" value="#4a90d9" aria-label="Category colour">
        <button type="submit">Add category</button>
        <output id="add-category-error" class="form-error"></output>
    </form>
</body>
</html>
